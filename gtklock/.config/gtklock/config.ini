# ~/.config/gtklock/config.ini — Windows-style lock screen (clock first, any key shows the sign-in form).
[main]
gtk-theme=Adwaita-dark
style=/home/lite/.config/gtklock/style.css
modules=/usr/lib/gtklock/userinfo-module.so;/usr/lib/gtklock/powerbar-module.so;/usr/lib/gtklock/playerctl-module.so
background=/home/lite/.local/state/wallpaper
time-format=%H:%M
date-format=%A, %B %-d
start-hidden=true
idle-hide=true
idle-timeout=15

[userinfo]
image-size=96
horizontal-layout=false
under-clock=true

[powerbar]
show-labels=true
linked-buttons=false
reboot-command=systemctl reboot
poweroff-command=systemctl poweroff
suspend-command=systemctl suspend
logout-command=
userswitch-command=

[playerctl]
art-size=64
position=bottom-left
