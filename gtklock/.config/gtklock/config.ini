# ~/.config/gtklock/config.ini — Windows-style lock screen: big clock and date; any key
# shows the password box, which hides again after 15 s idle.
# No modules: the userinfo (avatar) module makes gtklock commit a wrongly sized lock
# surface, which sway treats as a protocol error (red "lock client died" screen).
[main]
gtk-theme=Adwaita-dark
style=/home/lite/.config/gtklock/style.css
background=/home/lite/.local/state/wallpaper
time-format=%H:%M
date-format=%A, %B %-d
start-hidden=true
idle-hide=true
idle-timeout=15
