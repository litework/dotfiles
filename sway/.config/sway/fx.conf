# ~/.config/sway/fx.conf — SwayFX eye candy (only valid under SwayFX; `swayfx-revert` disables it).
# Kept light for an old Intel GPU: 2 blur passes, small radius.
corner_radius 8
smart_corner_radius enable

shadows enable
shadows_on_csd disable
shadow_blur_radius 14
shadow_color #0000007a

blur enable
blur_xray disable
blur_passes 2
blur_radius 4

# Blur behind the taskbar, flyouts, pop-ups and notifications (not the click-catcher).
layer_effects "waybar" "blur enable; blur_ignore_transparent enable"
layer_effects "quick-panel" "blur enable; blur_ignore_transparent enable; corner_radius 12; shadows enable"
layer_effects "quick-panel-osd" "blur enable; blur_ignore_transparent enable; corner_radius 12; shadows enable"
layer_effects "notifications" "blur enable; blur_ignore_transparent enable"
