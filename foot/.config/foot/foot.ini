# ~/.config/foot/foot.ini (replaces urxvt; `foot --server` + footclient replaces urxvtd)
include=~/.cache/wallust/colors-foot.ini

[main]
font=Pragmata Pro Mono:size=11, Symbols Nerd Font Mono:size=10
pad=9x9

[cursor]
style=beam
beam-thickness=1.5

[scrollback]
lines=10000

[url]
launch=xdg-open ${url}

[mouse]
hide-when-typing=yes
